<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>출결메이트 - 로그인</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    body { font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; }
  </style>
</head>
<body class="bg-[#FBFBFA] text-[#18181B] min-h-screen flex flex-col justify-between items-center p-6 antialiased selection:bg-teal-100 selection:text-teal-900">
  <div class="w-full flex justify-end">
    <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-[#F4F4F5] text-[#71717A] border border-[#E4E4E7]">
      <svg class="w-3.5 h-3.5 text-[#A1A1AA]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
      </svg>
      <span>이 PC에만 저장</span>
    </div>
  </div>

  <div class="w-full max-w-[420px] flex flex-col items-center text-center my-auto">
    <!-- 로고 -->
    <div class="w-16 h-16 rounded-2xl bg-[#0F766E] flex items-center justify-center shadow-sm mb-5 p-2">
      <img src="https://lh3.googleusercontent.com/aida/AEtjO1XCByYcAah5JGlg_-vowuWijwo-FsIlbj33PsziWyUx8Qch4UVOXG9312HC3jY6WNvUk5Unfw_70gPFfw7hDxqhTczqtrtC5jkIJU0ZupWZKslyYoSv5zjpF83aLAcStgCJToVSxkO8p2yCla4KljDba5pKgCoBmuJ234_XsiIIb4m5FZjy0OkrMl2GUuOAIBCzwrfbAfwrLMS2OGGTU2FknDvnh2dACzOJNjq5Del85eFamsQxNp92cg" alt="출결메이트" class="w-full h-full object-contain filter invert-0" />
    </div>

    <!-- 타이틀 및 부제 -->
    <h1 class="text-2xl font-bold tracking-tight text-[#18181B] mb-2">출결메이트</h1>
    <p class="text-sm text-[#71717A] mb-8 leading-relaxed">
      나이스 일일출결 전, 담임교사를 위한 가벼운 초안 기록장.<br/>
      예외 학생만 메모하면 크롬 확장이 나이스에 알아서 입력합니다.
    </p>

    <!-- 카드 본문 -->
    <div class="w-full bg-white border border-[#E4E4E7] rounded-2xl p-7 shadow-sm">
      <div class="flex flex-col gap-4">
        <!-- 구글 단독 로그인 버튼 -->
        <button class="w-full flex items-center justify-center gap-3 py-3 px-4 rounded-xl border border-[#D4D4D8] bg-white hover:bg-[#F4F4F5] transition text-sm font-medium text-[#18181B] shadow-xs active:scale-[0.99]">
          <svg class="w-4 h-4" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          <span>구글 계정으로 시작하기</span>
        </button>

        <div class="relative flex items-center justify-center my-2">
          <div class="border-t border-[#E4E4E7] w-full"></div>
          <span class="bg-white px-3 text-[11px] font-medium text-[#A1A1AA] uppercase absolute tracking-wider">교원 안심 인증</span>
        </div>

        <div class="bg-[#F8FAFC] border border-[#E2E8F0] rounded-xl p-3.5 text-left flex items-start gap-2.5">
          <div class="w-4 h-4 rounded-full bg-teal-100 text-teal-800 flex items-center justify-center flex-shrink-0 mt-0.5 text-[10px] font-bold">✓</div>
          <div class="text-xs text-[#475569] leading-relaxed">
            <span class="font-semibold text-[#0F766E]">출결 원문은 이 브라우저에만 남습니다.</span><br/>
            외부 서버에 학생 정보가 저장되지 않으며, 컴퓨터의 브라우저 로컬 저장소에 안전하게 유지됩니다.
          </div>
        </div>
      </div>
    </div>

    <!-- 나이스 비교 안내 (신뢰감 부여) -->
    <div class="mt-6 flex items-center justify-center gap-6 text-xs text-[#71717A]">
      <span class="flex items-center gap-1.5">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span> 공동인증서 불필요
      </span>
      <span class="flex items-center gap-1.5">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span> 넥사크로 프로그램 미설치
      </span>
    </div>
  </div>

  <div class="text-xs text-[#A1A1AA] text-center">
    대한민국 중학교 교원 맞춤형 초안 워크스페이스 · 출결메이트
  </div>
</body>
</html>
