<!doctype html>
<html lang="ko">
<head><meta charset="utf-8" /><title>nexacro popup sparse</title>
<style>
body{margin:0;font:12px sans-serif}
#decoyUnexcused{position:absolute;left:400px;top:40px;color:#999}
#popupLayer{position:absolute;left:80px;top:90px;width:340px;padding:12px;border:1px solid #888;background:#fff;z-index:20}
#popupLayer.hidden{display:none}
.RadioItemControl{display:inline-flex;margin:4px;padding:2px 6px;border:1px solid #ccc;cursor:pointer}
.RadioItemControl.is-disabled{opacity:.4;pointer-events:none}
.contentsbox{display:inline-block}
.nexa-btn.contentsbox{margin-top:10px;padding:4px 12px;border:1px solid #444;cursor:pointer}
</style></head>
<body>
<div id="grid">
  <div class="contentsbox">번호</div><div class="contentsbox">성명</div><div class="contentsbox">마감</div>
  <div>9</div><div>학생01</div><div id="closeCell" class="contentsbox">미마감</div>
  <div id="decoyUnexcused" class="contentsbox">미인정</div>
</div>
<div id="popupLayer" class="hidden" data-popup="close-kind">
  <div class="nexa-title contentsbox">출결마감구분</div>
  <div data-section="category">
    <div class="RadioItemControl" data-cat="질병"><div class="contentsbox radioText">질병</div></div>
    <div class="RadioItemControl" data-cat="미인정"><div class="contentsbox radioText">미인정</div></div>
    <div class="RadioItemControl" data-cat="기타"><div class="contentsbox radioText">기타</div></div>
    <div class="RadioItemControl" data-cat="출석인정"><div class="contentsbox radioText">출석인정</div></div>
  </div>
  <div data-section="type" id="typeRow">
    <div class="RadioItemControl is-disabled" data-type="지각" aria-disabled="true"><div class="contentsbox radioText">지각</div></div>
    <div class="RadioItemControl is-disabled" data-type="조퇴" aria-disabled="true"><div class="contentsbox radioText">조퇴</div></div>
    <div class="RadioItemControl is-disabled" data-type="결석" aria-disabled="true"><div class="contentsbox radioText">결석</div></div>
    <div class="RadioItemControl is-disabled" data-type="결과" aria-disabled="true"><div class="contentsbox radioText">결과</div></div>
  </div>
  <div><span class="contentsbox">사유</span><input id="reasonInput" type="text" /></div>
  <div class="nexa-btn contentsbox" id="applyBtn">적용</div>
  <div class="nexa-btn contentsbox" id="closeAllBtn" style="display:none">출결마감</div>
  <div class="nexa-btn contentsbox" id="closeBtn">닫기</div>
</div>
<script>
document.querySelectorAll('[data-section="category"] .RadioItemControl').forEach(function(el){
  el.addEventListener('click', function(){
    document.querySelectorAll('#typeRow .RadioItemControl').forEach(function(t){
      t.classList.remove('is-disabled');
      t.removeAttribute('aria-disabled');
    });
  });
});
</script>
</body></html>
