<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>출결메이트</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <h1>출결메이트</h1>
      <p id="status" class="status">확인 중…</p>
      <p id="queue" class="muted">대기열: …</p>
      <div class="actions">
        <button type="button" id="btnDry" class="primary">시운전 (저장 전 중단)</button>
        <button type="button" id="btnSave" class="danger">적용 후 저장</button>
        <button type="button" id="btnClear" class="ghost">대기열 비우기</button>
      </div>
      <p id="result" class="muted"></p>
      <p class="hint">날짜가 바뀌기 전에 저장. 빨간 버튼이 저장까지 함. 출결마감은 안 누름.</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
